<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mes succès{% endblock %}</title>
  <style>
    :root {
      --bg: #12141a; --card: #1c1f28; --text: #e8eaf0;
      --muted: #949bb0; --accent: #6c9cff; --line: #2b3040;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { display: flex; justify-content: space-between; align-items: center;
             gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    .card { background: var(--card); border-radius: 10px; padding: 1rem; }
    .muted { color: var(--muted); font-size: 0.875rem; }
    /* display:block indispensable : la barre est un <span> dans la liste, et un
       element inline ignorerait height/width, la rendant invisible. */
    .bar { display: block; height: 6px; background: var(--line);
           border-radius: 3px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); }
    button { background: var(--accent); color: #0b0d12; border: 0;
             border-radius: 6px; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
    input { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
            color: var(--text); padding: 0.55rem 0.75rem; font: inherit; width: 100%; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .error { color: #ff8a8a; }

    /* --- Liste des jeux --- */
    .games { list-style: none; margin: 0; padding: 0;
             display: flex; flex-direction: column; gap: 0.5rem; }
    .game { background: var(--card); border-radius: 10px; overflow: hidden; }
    .row {
      display: grid; grid-template-columns: 46px 1fr auto 1.5rem;
      gap: 0.9rem; align-items: center;
      width: 100%; padding: 0.6rem 0.9rem; text-align: left;
      background: none; color: inherit; border: 0; border-radius: 0;
      font: inherit; cursor: pointer;
    }
    .row:hover { background: #232733; }
    .cover { width: 46px; height: 69px; object-fit: cover; border-radius: 4px;
             background: var(--line); display: block; }
    .title { display: block; font-weight: 600; }
    .counts { display: block; white-space: nowrap; font-variant-numeric: tabular-nums;
              margin-bottom: 0.25rem; }
    .progress { width: 160px; }
    .chevron { color: var(--muted); transition: transform 0.15s ease; }
    .row[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .details { padding: 0 0.9rem 0.9rem; }
    .empty { color: var(--muted); padding: 1rem; }

    /* --- Succès --- */
    .achievements { display: grid; gap: 0.6rem;
                    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .ach { display: flex; gap: 0.7rem; align-items: flex-start;
           background: #232733; border-radius: 8px; padding: 0.6rem; }
    .ach img { width: 40px; height: 40px; border-radius: 5px; flex-shrink: 0;
               background: var(--line); }
    .ach.locked { opacity: 0.45; }
    .ach.locked img { filter: grayscale(1); }
    .ach strong { font-size: 0.9rem; }
    /* Rarete : distincte de .muted pour ressortir, et mise en avant quand le
       succes est vraiment rare. */
    .rarete { font-size: 0.8rem; color: #7f8798; margin-top: 0.15rem; }
    .rarete.rare { color: #f0b354; font-weight: 600; }

    @media (max-width: 640px) {
      body { padding: 0.9rem; }
      .row { grid-template-columns: 40px 1fr 1.25rem; row-gap: 0.5rem; }
      .cover { width: 40px; height: 60px; }
      .progress { grid-column: 1 / -1; width: auto; }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
